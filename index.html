<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="toolbar">
      <div id="tools" class="group"></div>
      <div id="colors" class="group"></div>
      <div id="widths" class="group"></div>
      <div class="spacer"></div>
      <button id="undo" title="Undo (⌘Z)">Undo</button>
      <button id="copy" title="Copy (⌘C)">Copy</button>
      <button id="save" title="Save (⌘S)">Save…</button>
    </header>
    <main id="area">
      <canvas id="canvas"></canvas>
    </main>
    <div id="toast" hidden></div>
  </body>
</html>
